# Vox Transfer configuration: copy to ~/.config/vox/config.toml and uncomment what you want to
# change, or choose Settings… from the Vox Transfer menu, which writes most of these for you.
# Every commented-out setting shows its default. Vox Transfer applies changes within a few
# seconds of a save. Screen hints and the recording limit apply from the next dictation, and [audio]
# changes wait for a recording in progress to end.
#
# If this file has an error when Vox Transfer starts, Vox Transfer starts anyway but does not record
# until you fix it: the Vox Transfer menu shows "Settings file has an error" and the log names the
# setting. An error in a later edit is logged, and the previous settings stay in effect.
#
# The OpenAI API key does not go here. Set it on the Transcription page of Settings; Vox Transfer
# keeps it in the macOS Keychain or your Linux login keyring. OPENAI_API_KEY in the environment
# overrides it.

# Words the transcriber should spell exactly as written, sent as hints with every dictation.
# The Vocabulary page of Settings edits this list. For example:
#   dictionary = ["FastAPI", "PostgreSQL", "Kubernetes"]
# dictionary = []

[hotkey]
# The Hotkey page of Settings records the key and the combination for you.
# The key that starts and stops dictation when tapped on its own. Double-tap it to cancel.
# Other choices include "right_ctrl", "right_alt", "cmd_r" (macOS), "f13", "fn" (macOS, the Globe
# key), "pause" and "scroll_lock" (Linux).
# key = "right_shift"
# An optional key combination that also toggles dictation, for example "ctrl+space", where "ctrl"
# is the left Control key and "right_ctrl" the right one.
# fallback = ""
# Enable double-tap cancellation (off by default; use the overlay × to cancel).
# double_tap_cancel = false

# How quickly the second tap of a double-tap must follow the first, in milliseconds.
# double_tap_timeout_ms = 400

[audio]
# The input device: unset uses the system default. Set an index or name from `vox --list-devices`.
# The General page of Settings lists the devices and saves the name of the one you pick.
# For example:
#   device = "MacBook Pro Microphone"
# sample_rate = 48000
# channels = 1
# The recording limit, in seconds. A recording that reaches it stops and is transcribed as usual.
# The General page of Settings sets it to 5, 10, 15, 30 or 60 minutes.
# max_recording_seconds = 900

[transcription]
# Save failed audio locally until recovery or deletion in History. Turning off stops new saves and retries.
# keep_failed_audio = true
# "batch" and "streaming" send audio to OpenAI; "whisper_cpp" transcribes on this computer.
# The Transcription page of Settings switches between them and saves the choice here.
# mode = "batch"
# The OpenAI model for streaming mode.
# streaming_model = "gpt-live-transcribe"
# The spoken language, as an ISO code: unset detects it automatically. For example:
#   language = "en"
# Text that primes the transcriber in every mode, such as names or a writing style.
# On Linux, Local (whisper.cpp) mode passes this and the dictionary on whisper-cli's command line,
# which other accounts on the computer can see.
# prompt = ""

[whisper]
# The OpenAI model for batch mode.
# model = "gpt-transcribe"

[whisper_cpp]
# Local transcription with whisper.cpp (https://github.com/ggml-org/whisper.cpp). No OpenAI key is
# needed and no audio leaves this computer. In a whisper.cpp checkout, run:
#   cmake -B build && cmake --build build -j --config Release
#   sh ./models/download-ggml-model.sh large-v3-turbo
# then set model below (or choose both files on the Transcription page of Settings) and choose
# Local (whisper.cpp) there. Paths may be
# absolute, start with ~, or be relative to this file. Give binary as a full path when Vox Transfer
# runs at login, since the login service may not search the same PATH as your shell. For example:
#   binary = "~/whisper.cpp/build/bin/whisper-cli"
#   model = "~/whisper.cpp/models/ggml-large-v3-turbo.bin"
# If the setup is broken, the Vox Transfer menu says why, and each hotkey press checks it again.
# binary = "whisper-cli"
# model = ""
# When the graphics card has no memory left for the model (a game is running, say), transcribe on
# the processor instead, which is slower. Set to false to fail with an error instead.
# cpu_fallback = true

[context]
# Screen hints: send words from the focused window (its title and visible text) to the transcriber
# as spelling hints. Text that looks like a password, token or API key is left out. Capturing the
# window's text needs the Screen Recording permission on macOS. Set to false to send no window
# words at all and never capture the screen. On Linux, Local (whisper.cpp) mode uses no window
# words and captures nothing either way.
# screen = true

[overlay]
# Show the optional recording waveform and transcription status on macOS and Linux/X11 desktops.
# Also available in General Settings. Native Wayland/headless sessions have no overlay.
# Enabling waits for the next recording; disabling dismisses it when the change is applied.
# Follows macOS Reduce Motion or disabled Linux animations with a static line and immediate transitions.
# enabled = true

[sounds]
# Play a sound when dictation starts, stops, is cancelled or fails, when the hotkey is ignored
# because Vox Transfer is busy or paused, and on pause and resume. To replace one, put a WAV file
# named start.wav, stop.wav, cancel.wav, error.wav, busy.wav, pause.wav or resume.wav in
# ~/.config/vox/sounds; Vox Transfer loads them when it starts.
# enabled = true

[attenuation]
# Lower the system volume while recording, then restore it.
# enabled = true
# The volume while recording, as a fraction of the current volume.
# level = 0.5

[snippets]
# When a whole dictation matches a trigger (ignoring case and trailing .?!,), Vox Transfer pastes
# the expansion instead. The Snippets page of Settings edits these. For example:
#   "my email" = "alex@example.com"
#   "my address" = "123 Main St, Springfield, IL"

[window_classes]
# Tell Vox Transfer what kind of app a window belongs to: TERMINAL, EDITOR, CHAT, EMAIL, BROWSER or
# OTHER. Each key is matched, ignoring case, as part of the window's WM_CLASS on Linux, or of its
# bundle identifier and app name on macOS. On Linux, TERMINAL apps get Ctrl+Shift+V instead of
# Ctrl+V, and terminals running tmux give their pane text as screen hints. For example:
#   "Slack" = "CHAT"
#   "org.wezfurlong.wezterm" = "TERMINAL"
