# Vox configuration
# Copy to ~/.config/vox/config.toml

[api]
# API key (can also be set via OPENAI_API_KEY environment variable)
# openai_api_key = "sk-..."

[hotkey]
key = "right_shift"
fallback = "ctrl+space"

[audio]
# device = 0              # Audio input device index (use --list-devices)
sample_rate = 16000
channels = 1
max_recording_seconds = 30

[whisper]
model = "gpt-4o-mini-transcribe-2025-12-15"
# language = "en"         # Force language (auto-detect if unset)

[sounds]
enabled = true

# Custom dictionary - words to preserve as-is
# dictionary = ["FastAPI", "PostgreSQL", "Kubernetes"]

# Snippets - exact match on raw transcript -> expansion (skips LLM)
# [snippets]
# "my email" = "alex@example.com"
# "my address" = "123 Main St, Springfield, IL"

# Window class overrides (WM_CLASS -> app type)
# [window_classes]
# "Slack" = "CHAT"
# "Discord" = "CHAT"
# "Thunderbird" = "EMAIL"
