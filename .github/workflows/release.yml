name: Release

on:
  push:
    tags: ["v*"]
  # A dry run: builds and smoke-tests every release file from the chosen branch or tag, and publishes nothing
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.19"

jobs:
  version:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A tag must name the version in pyproject.toml, and CHANGELOG.md must describe it
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          # A dry run from a branch has no tag to check
          if [ "$REF_TYPE" = tag ] && [ "$TAG" != "v$version" ]; then
              echo "::error::tag $TAG does not match version $version in pyproject.toml"
              exit 1
          fi
          scripts/changelog-notes.sh "$version" >/dev/null
          echo "version=$version" >>"$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  build:
    needs: version
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Wheel, built with the locked setuptools
        run: uv build --wheel --out-dir dist --build-constraints requirements.lock --require-hashes
      # install.sh downloads this and installs from it, so it is the released tree exactly
      - name: Source tarball
        run: git archive --format=tar.gz --prefix="vox-$VERSION/" --output="dist/vox-$VERSION.tar.gz" "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  tarball:
    needs: [version, build]
    timeout-minutes: 30
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Unpack the tarball
        run: tar -xzf "dist/vox-$VERSION.tar.gz" -C "$RUNNER_TEMP"
      - name: Install, update and uninstall it in a clean Ubuntu 24.04
        if: runner.os == 'Linux'
        run: docker run --rm -v "$RUNNER_TEMP/vox-$VERSION:/src:ro" ubuntu:24.04 /src/scripts/test-install-linux.sh
      # install.sh on macOS installs with uv
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: runner.os == 'macOS'
        with:
          version: ${{ env.UV_VERSION }}
      # No login service: a runner has no GUI session to start it in
      - name: Install and uninstall it on macOS
        if: runner.os == 'macOS'
        run: |
          src="$RUNNER_TEMP/vox-$VERSION"
          bash "$src/install.sh" --no-service
          "$HOME/.local/bin/vox" --version | grep -qF "$VERSION"
          bash "$src/install.sh" --uninstall
          if [ -e "$HOME/.local/share/vox/venv" ] || [ -L "$HOME/.local/bin/vox" ]; then
              echo "::error::--uninstall left Vox Transfer behind"
              exit 1
          fi

  deb:
    needs: [version, build]
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Build the package from the release wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv
          packaging/deb/build-deb.sh "$VERSION" "$ARCH" "dist/vox-$VERSION-py3-none-any.whl"
      - name: Install, upgrade and remove it in a clean Ubuntu 24.04
        run: docker run --rm -v "$PWD:/src:ro" -w /src ubuntu:24.04 packaging/deb/smoke-test.sh "dist/vox_${VERSION}_${ARCH}.deb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-${{ matrix.arch }}
          path: dist/vox_${{ env.VERSION }}_${{ matrix.arch }}.deb
          if-no-files-found: error

  # Everything a release publishes, as a workflow artifact; a dry run stops here
  assets:
    needs: [version, ci, build, tarball, deb]
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Assets and checksums
        run: |
          mkdir release
          cp "artifacts/vox-$VERSION.tar.gz" artifacts/vox_"$VERSION"_*.deb install.sh release/
          cd release
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: |
          {
              echo "## Vox Transfer $VERSION release notes"
              echo
              scripts/changelog-notes.sh "$VERSION"
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    # Only a pushed tag publishes; a manual run is a dry run
    if: github.event_name == 'push'
    needs: [version, assets]
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # to create the release; no other job can write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/changelog-notes.sh "$VERSION" >notes.md
          flags=()
          # A pre-release (1.1.0rc1) must not become the latest release that install.sh installs
          case "$VERSION" in *[a-z]*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "Vox Transfer $VERSION" --notes-file notes.md "${flags[@]}" release/*
