[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vox"
version = "0.1.0"
description = "Voice-to-text daemon for Linux"
requires-python = ">=3.12"
dependencies = [
    "pynput>=1.7.6",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "openai>=1.12",
    "webrtcvad>=2.0.10",
    "setuptools<81",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pyobjc-framework-Vision; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
]

[tool.setuptools.packages.find]
include = ["vox*"]

[project.scripts]
vox = "vox.__main__:main"
